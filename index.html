<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文化＋！串 | 留下你的文化印記</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    background: #f7f5f0;
    color: #1a1a1a;
  }
  .logo-wrap { text-align: center; margin-bottom: 20px; }
  .logo-wrap img { width: 100%; max-width: 360px; }

  h2 { font-size: 17px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #5f5e5a; margin-bottom: 16px; }

  .upload-box {
    border: 2px dashed #b4b2a9;
    border-radius: 16px;
    background: #fff;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .upload-box.has-image { border-style: solid; border-color: #1a1a1a; }
  .upload-box input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .upload-hint { font-size: 14px; color: #5f5e5a; }
  .upload-hint .big { font-size: 32px; display: block; margin-bottom: 8px; }
  #preview {
    display: none; width: 100%; height: 100%; object-fit: cover;
  }

  .or-divider {
    text-align: center; font-size: 16px; font-weight: 600; color: #1a1a1a;
    margin: 16px 0 10px; display: flex; align-items: center; gap: 10px;
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: #e3e1d8;
  }
  .sample-gallery {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .sample-thumb {
    aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden;
    border: 2px solid transparent; cursor: pointer; background: #fff;
  }
  .sample-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sample-thumb.selected { border-color: #1a1a1a; }

  .field { margin-top: 22px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  textarea {
    width: 100%; padding: 12px; border: 1px solid #d3d1c7; border-radius: 10px;
    font-size: 15px; background: #fff; resize: none; font-family: inherit;
  }
  .char-count { text-align: right; font-size: 12px; color: #b4b2a9; margin-top: 4px; }
  .print-hint { color: #c0392b; font-size: 16px; font-weight: 700; text-align: center; margin-top: 20px; }

  button.submit {
    width: 100%; padding: 15px; margin-top: 22px; border: none; border-radius: 12px;
    background: #1a1a1a; color: #fff; font-size: 16px; font-weight: 500; cursor: pointer;
  }
  button.submit:disabled { background: #b4b2a9; cursor: not-allowed; }

  .result { margin-top: 16px; padding: 14px; border-radius: 10px; background: #eaf3de; font-size: 14px; display: none; text-align: center; }
  .error { margin-top: 16px; padding: 14px; border-radius: 10px; background: #fcebeb; font-size: 14px; display: none; }

  .coupon-screen { text-align: left; padding: 40px 4px 20px; }
  .coupon-screen.center { text-align: center; padding: 60px 16px 40px; }
  .coupon-screen h2 { font-size: 19px; margin-bottom: 4px; }
  .coupon-screen .sub { margin-bottom: 20px; }

  .coupon-qr-img {
    width: 220px; height: 220px; margin: 8px auto 24px; display: block;
    border: 1px solid #d3d1c7; border-radius: 12px; background: #fff;
    padding: 14px; box-sizing: content-box; image-rendering: pixelated;
  }
  button.submit.secondary {
    background: #fff; color: #1a1a1a; border: 1px solid #b4b2a9; margin-top: 10px;
  }

  .poster-preview {
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #d3d1c7;
    margin-bottom: 20px;
  }
  .poster-preview img {
    width: 100%;
    display: block;
  }
</style>
</head>
<body>

<div class="logo-wrap">
  <img src="assets/logo.png" alt="文化＋！串 CHIAYI CULTURE CONNECT">
</div>

<div id="formSection">

<h2>上傳、拍照或選擇以下範例照片</h2>
<div class="sub">拍照打卡留下這一刻，列印出屬於您的文化收據。</div>

<div class="upload-box" id="uploadBox">
  <input type="file" id="photoInput" accept="image/*">
  <div class="upload-hint" id="uploadHint">
    <span class="big">＋</span>
    點這裡上傳或拍照
  </div>
  <img id="preview">
</div>

<div class="or-divider">或從範例圖片選一張</div>
<div class="sample-gallery" id="sampleGallery"></div>

<div class="field">
  <label>留下一句：你覺得文化是甚麼？／甚麼是文化？</label>
  <textarea id="quote" rows="3" maxlength="60" placeholder="例如：文化是阿嬤手上那道菜的味道"></textarea>
  <div class="char-count"><span id="quoteLen">0</span>/60</div>
</div>

<div class="print-hint">領取收據時，請壓住標籤機，由右往左撕！！</div>
<button class="submit" id="submitBtn" disabled>送出並列印成品</button>

<div class="result" id="result"></div>
<div class="error" id="errorBox"></div>

</div>

<div class="coupon-screen" id="couponPromptSection" style="display:none;">
  <div class="poster-preview">
    <img src="assets/coupon-poster.jpg" alt="嘉義串燒宇宙串連">
  </div>

  <h2>要不要順便領取</h2>
  <div class="sub">串燒店續攤優惠券？</div>

  <button class="submit" id="couponYesBtn">要領取</button>
  <button class="submit secondary" id="couponNoBtn">不需要，謝謝</button>
</div>

<div class="coupon-screen center" id="couponQrSection" style="display:none;">
  <h2>一起去續攤吧！</h2>
  <div class="sub">手機掃碼領券或長按圖片打開</div>
  <img src="assets/coupon-qr.png" class="coupon-qr-img" alt="續攤優惠券 QR Code">
</div>

<div class="coupon-screen center" id="thankyouSection" style="display:none;">
  <h2>謝謝光臨</h2>
  <div class="sub">期待你下次再來探索嘉義文化 :)</div>
</div>

<script>
// ⚠️ 請把這裡換成您實際部署的後端網址
const API_BASE_URL = "https://culture-connect-backend.onrender.com";

let selectedFile = null;

// 範例圖片：放在 assets/samples/ 資料夾，命名為 sample-01.jpg、sample-02.jpg...
// 之後要增減張數，只要改這個數字並把對應檔案放進資料夾即可。
const SAMPLE_COUNT = 28;

function renderSamples() {
  const gallery = document.getElementById('sampleGallery');
  let html = '';
  for (let i = 1; i <= SAMPLE_COUNT; i++) {
    const n = String(i).padStart(2, '0');
    html += `<div class="sample-thumb" data-src="assets/samples/sample-${n}.jpg">
      <img src="assets/samples/sample-${n}.jpg" loading="lazy">
    </div>`;
  }
  gallery.innerHTML = html;
  gallery.querySelectorAll('.sample-thumb').forEach(thumb => {
    thumb.addEventListener('click', () => selectSample(thumb.dataset.src, thumb));
  });
}
renderSamples();

async function selectSample(src, el) {
  document.querySelectorAll('.sample-thumb').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');

  uploadHint.innerHTML = '照片處理中...';
  try {
    const res = await fetch(src);
    const blob = await res.blob();
    const file = new File([blob], 'sample.jpg', { type: blob.type || 'image/jpeg' });
    const compressed = await compressImage(file);
    selectedFile = compressed;

    const reader = new FileReader();
    reader.onload = ev => {
      preview.src = ev.target.result;
      preview.style.display = 'block';
      uploadHint.style.display = 'none';
      uploadBox.classList.add('has-image');
    };
    reader.readAsDataURL(compressed);
    updateSubmitState();
  } catch (err) {
    uploadHint.innerHTML = '<span class="big">＋</span>點這裡上傳或拍照';
    el.classList.remove('selected');
    alert('範例圖片載入失敗，請再試一次');
  }
}

// 手機直接拍的照片常常好幾 MB，在訊號不好時容易上傳失敗或逾時。
// 這裡在選好照片後，先裁切成 3:4 直式比例（跟預覽框、跟最後印出來的小卡一致），
// 再縮小、壓縮，大幅降低上傳失敗的機率，畫質對於 75x100mm 小卡來說也完全足夠。
function compressImage(file, maxSize = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        const targetRatio = 3 / 4; // 寬:高，直式構圖
        let { width: sw, height: sh } = img;
        let cropW = sw, cropH = sh;
        if (sw / sh > targetRatio) {
          cropW = sh * targetRatio;
        } else {
          cropH = sw / targetRatio;
        }
        const sx = (sw - cropW) / 2;
        const sy = (sh - cropH) / 2;

        let outW = cropW, outH = cropH;
        const longSide = Math.max(cropW, cropH);
        if (longSide > maxSize) {
          const scale = maxSize / longSide;
          outW = Math.round(cropW * scale);
          outH = Math.round(cropH * scale);
        }

        const canvas = document.createElement('canvas');
        canvas.width = outW;
        canvas.height = outH;
        canvas.getContext('2d').drawImage(img, sx, sy, cropW, cropH, 0, 0, outW, outH);
        canvas.toBlob(
          blob => resolve(blob ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file),
          'image/jpeg',
          quality
        );
      };
      img.onerror = () => resolve(file); // 萬一裁切/縮圖失敗，退回用原始檔案
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(file);
    reader.readAsDataURL(file);
  });
}

const uploadBox = document.getElementById('uploadBox');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const uploadHint = document.getElementById('uploadHint');
const quote = document.getElementById('quote');
const quoteLen = document.getElementById('quoteLen');
const submitBtn = document.getElementById('submitBtn');

photoInput.addEventListener('change', async () => {
  const file = photoInput.files[0];
  if (!file) return;

  document.querySelectorAll('.sample-thumb').forEach(t => t.classList.remove('selected'));

  // 先壓縮，壓縮完的檔案才是真正拿去預覽跟上傳的檔案
  uploadHint.innerHTML = '照片處理中...';
  const compressed = await compressImage(file);
  selectedFile = compressed;

  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'block';
    uploadHint.style.display = 'none';
    uploadBox.classList.add('has-image');
  };
  reader.readAsDataURL(compressed);

  updateSubmitState();
});

quote.addEventListener('input', () => {
  quoteLen.textContent = quote.value.length;
  updateSubmitState();
});

function updateSubmitState() {
  submitBtn.disabled = !(selectedFile && quote.value.trim().length > 0);
}

submitBtn.addEventListener('click', async () => {
  submitBtn.disabled = true;
  submitBtn.textContent = '送出中...';

  try {
    const formData = new FormData();
    formData.append('photo', selectedFile);
    formData.append('quote', quote.value.trim());

    const res = await fetch(`${API_BASE_URL}/api/submissions`, {
      method: 'POST',
      body: formData,
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '送出失敗');

    document.getElementById('result').style.display = 'block';
    document.getElementById('result').textContent = '已送出！小卡正在為你印出，請稍候取件 :)';
    document.getElementById('errorBox').style.display = 'none';

    // 重置表單
    selectedFile = null;
    photoInput.value = '';
    preview.style.display = 'none';
    uploadHint.innerHTML = '<span class="big">＋</span>點這裡上傳或拍照';
    uploadHint.style.display = 'block';
    uploadBox.classList.remove('has-image');
    document.querySelectorAll('.sample-thumb').forEach(t => t.classList.remove('selected'));
    quote.value = '';
    quoteLen.textContent = '0';

    // 停留一下讓使用者看到「已送出」的訊息，接著切換到優惠券詢問畫面
    setTimeout(() => {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('couponPromptSection').style.display = 'block';
    }, 1800);
  } catch (err) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorBox').textContent = '送出失敗，請確認網路連線後再試一次：' + err.message;
  } finally {
    submitBtn.textContent = '送出並列印成品';
    updateSubmitState();
  }
});

document.getElementById('couponYesBtn').addEventListener('click', () => {
  document.getElementById('couponPromptSection').style.display = 'none';
  document.getElementById('couponQrSection').style.display = 'block';
});

document.getElementById('couponNoBtn').addEventListener('click', () => {
  document.getElementById('couponPromptSection').style.display = 'none';
  document.getElementById('thankyouSection').style.display = 'block';
});
</script>

</body>
</html>
